networks:
  backend_net:
    internal: false

services:
  backend:
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "dev-only-change-me-use-a-unique-32-character-secret"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,nginx"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173"
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173"
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SECURE_COOKIES: "False"
      DJANGO_HSTS_SECONDS: "0"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  db:
    ports:
      - "5433:5432"
