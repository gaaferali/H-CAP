volumes:
  postgres_data:
  media_data:

networks:
  frontend_net:
  backend_net:
    internal: true

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hcap-backend:latest
    container_name: Backend
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY to a unique value of at least 50 characters}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?Set the production host names}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set the trusted frontend origins}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?Set the trusted HTTPS origins}"
      DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-True}"
      DJANGO_SECURE_COOKIES: "${DJANGO_SECURE_COOKIES:-True}"
      DJANGO_HSTS_SECONDS: "${DJANGO_HSTS_SECONDS:-31536000}"
      JWT_ACCESS_MINUTES: "${JWT_ACCESS_MINUTES:-15}"
      JWT_REFRESH_DAYS: "${JWT_REFRESH_DAYS:-7}"
      JWT_REFRESH_COOKIE: "${JWT_REFRESH_COOKIE:-hcap_refresh}"
      API_LOGIN_RATE: "${API_LOGIN_RATE:-8/min}"
      API_REFRESH_RATE: "${API_REFRESH_RATE:-30/min}"
      API_ANON_RATE: "${API_ANON_RATE:-60/min}"
      API_USER_RATE: "${API_USER_RATE:-600/min}"
      DJANGO_LOG_LEVEL: "${DJANGO_LOG_LEVEL:-INFO}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_TIME_ZONE: "${DJANGO_TIME_ZONE:-UTC}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    command: ["sh", "-c", "uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-1} --timeout-graceful-shutdown 30"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; connection = socket.create_connection(('127.0.0.1', 8000), 3); connection.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - frontend_net
      - backend_net

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hcap-frontend:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend_net

  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend_net
