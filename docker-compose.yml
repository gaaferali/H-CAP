volumes:
  postgres_data:
  media_data:

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hcap-backend:latest
    container_name: backend1
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-only-change-me-use-a-unique-32-character-secret}"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend,nginx"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173"
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173"
      POSTGRES_DB: "${POSTGRES_DB:-hcap}"
      POSTGRES_USER: "${POSTGRES_USER:-hcap}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hcap}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_TIME_ZONE: "${DJANGO_TIME_ZONE:-UTC}"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hcap-frontend:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-hcap}"
      POSTGRES_USER: "${POSTGRES_USER:-hcap}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hcap}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hcap} -d ${POSTGRES_DB:-hcap}"]
      interval: 5s
      timeout: 5s
      retries: 10
